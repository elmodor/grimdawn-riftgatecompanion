name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake mingw-w64 python3 zip

      - name: Determine Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Package
        run: |
          set -eux

          mkdir -p dist
          test -f build/RiftgateCompanion.dll
          test -f build/winmm.dll
          cp build/RiftgateCompanion.dll dist/
          cp build/winmm.dll dist/
          pushd dist
          zip -9 "../RiftgateCompanion-${VERSION}.zip" RiftgateCompanion.dll winmm.dll
          popd

      - name: Upload Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: RiftgateCompanion
          path: "RiftgateCompanion-${{ env.VERSION }}.zip"

      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" "RiftgateCompanion-${VERSION}.zip" --draft --generate-notes --title "RiftgateCompanion ${VERSION}" --verify-tag
